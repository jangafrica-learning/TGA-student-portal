<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>assignment</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #0037ad;
      --dark-blue: #001d5c;
      --bg: #eef3f9;
      --card: #ffffff;
      --border: #dfe5ef;
      --text: #1d2b53;
      --muted: #667085;
      --success: #0b6b2f;
      --error: #b00020;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .top {
      background: linear-gradient(135deg, var(--dark-blue), var(--blue));
      color: white;
      padding: 22px;
    }

    .top-inner {
      max-width: 1150px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .top h1 {
      font-size: 23px;
      margin-bottom: 5px;
    }

    .top p {
      color: #dbe6ff;
      font-size: 13px;
    }

    .container {
      max-width: 1150px;
      margin: 22px auto;
      padding: 0 14px;
    }

    .search-panel,
    .assignment-card,
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: none;
    }

    .search-panel {
      padding: 16px;
      margin-bottom: 16px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #17357a;
    }

    select,
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dce4ef;
      border-radius: 8px;
      font-size: 13px;
      background: white;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      padding: 10px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .primary {
      background: var(--blue);
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #17357a;
    }

    .message {
      margin-top: 10px;
      font-weight: 700;
      min-height: 18px;
    }

    .error { color: var(--error); }
    .success { color: var(--success); }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      padding: 14px;
      border-left: 4px solid var(--blue);
    }

    .stat-card span {
      display: block;
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .stat-card strong {
      font-size: 24px;
      color: var(--blue);
    }

    .assignments-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 12px;
    }

    .assignment-card {
      padding: 16px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .badge {
      background: #eef3f9;
      color: var(--blue);
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .assignment-card h3 {
      font-size: 15px;
      color: #17357a;
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .detail {
      font-size: 12.5px;
      margin: 6px 0;
    }

    .detail strong {
      color: #17357a;
    }

    .activity-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      line-height: 1.5;
      font-size: 12.5px;
    }

    .file-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .file-link {
      display: inline-block;
      background: var(--blue);
      color: white;
      text-decoration: none;
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .file-link.secondary-link {
      background: #e5e7eb;
      color: #17357a;
    }

    .empty-state {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px;
      text-align: center;
      color: var(--muted);
    }

    @media(max-width: 600px) {
      .top-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .button-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header class="top">
        <h1>My Assignments</h1>
        <p>Select your class then subject and click search to view available assignments.</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="search-panel">
      <div class="filters">
        <div>
          <label>School Level</label>
          <select id="level" onchange="updateSubjects()">
            <option value="">Select your class</option>
            <option value="JUNIOR">Junior</option>
            <option value="SENIOR1">Senior 1</option>
            <option value="SENIOR2">Senior 2</option>
          </select>
        </div>

        <div>
          <label>Subject</label>
          <select id="subject">
            <option value="ALL">All subjects</option>
          </select>
        </div>

        <div>
          <label>Search</label>
          <input type="text" id="searchText" placeholder="Search assignment, teacher, class...">
        </div>

        <div>
          <label>&nbsp;</label>
          <div class="button-row">
            <button class="primary" onclick="loadAssignments()">
              <i class="fas fa-search"></i> Search
            </button>
            <button class="secondary" onclick="clearSearch()">Clear</button>
          </div>
        </div>
      </div>

      <div id="message" class="message"></div>
    </div>

    <div id="stats" class="stats"></div>
    <div id="assignmentsContent" class="assignments-grid"></div>
  </main>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzw20Eejvw1Ye9U_JU6fQ0sZF_CBK9oVIxKh6GtDxgUZEAeDitU0BVQt9sui0tKA_wRGQ/exec';

    const LEVELS = {
      JUNIOR: {
        subjects: ['MATHS','SCIENCE','BUSINESS','LITERATURE','ENGLISH','HISTORY','OTHERS']
      },
      SENIOR1: {
        subjects: ['MATHS','SCIENCE','BUSINESS','AGRICULTURE','ENGLISH','HISTORY','OTHERS','MUSIC BUSINESS','FASHION & DESIGN']
      },
      SENIOR2: {
        subjects: ['MATHS','SCIENCE','BUSINESS','AGRICULTURE','ENGLISH','HISTORY','OTHERS','MUSIC BUSINESS','FASHION & DESIGN']
      }
    };

    function updateSubjects() {
      const level = document.getElementById('level').value;
      const subjectSelect = document.getElementById('subject');

      subjectSelect.innerHTML = '<option value="ALL">All subjects</option>';

      if (!level || !LEVELS[level]) return;

      LEVELS[level].subjects.forEach(subject => {
        const option = document.createElement('option');
        option.value = subject;
        option.textContent = subject;
        subjectSelect.appendChild(option);
      });
    }

    async function loadAssignments() {
      const level = document.getElementById('level').value;
      const subject = document.getElementById('subject').value || 'ALL';
      const search = document.getElementById('searchText').value.trim();

      const message = document.getElementById('message');
      const stats = document.getElementById('stats');
      const container = document.getElementById('assignmentsContent');

      stats.innerHTML = '';
      container.innerHTML = '';

      if (!level) {
        message.textContent = 'Please select your school level.';
        message.className = 'message error';
        return;
      }

      message.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading assignments...';
      message.className = 'message';

      try {
        const url =
          WEB_APP_URL +
          '?action=assignments' +
          '&level=' + encodeURIComponent(level) +
          '&subject=' + encodeURIComponent(subject) +
          '&search=' + encodeURIComponent(search);

        const result = await jsonp(url);

        if (!result.success) throw new Error(result.message);

        message.textContent = '';

        const teacherSet = new Set(result.assignments.map(a => a.teacher).filter(Boolean));
        const subjectSet = new Set(result.assignments.map(a => a.subject).filter(Boolean));

        stats.innerHTML = `
          <div class="stat-card">
            <span>Total Assignments</span>
            <strong>${result.assignments.length}</strong>
          </div>
          <div class="stat-card">
            <span>Subjects</span>
            <strong>${subjectSet.size}</strong>
          </div>
          <div class="stat-card">
            <span>Teachers</span>
            <strong>${teacherSet.size}</strong>
          </div>
        `;

        if (result.assignments.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <h3>No assignments found</h3>
              <p>Try another subject, class, teacher, or keyword.</p>
            </div>
          `;
          return;
        }

        result.assignments.forEach(item => {
          const card = document.createElement('div');
          card.className = 'assignment-card';

          const fileActions = item.fileUrl
            ? `
              <div class="file-actions">
                <a class="file-link" href="${escapeAttribute(item.fileUrl)}" target="_blank">
                  <i class="fas fa-eye"></i> View File
                </a>
                <a class="file-link secondary-link" href="${escapeAttribute(item.fileUrl)}" target="_blank" download>
                  <i class="fas fa-download"></i> Download
                </a>
              </div>
            `
            : `<div class="muted">No file uploaded for this assignment.</div>`;

          card.innerHTML = `
            <div class="badges">
              <span class="badge">${escapeHtml(item.level)}</span>
              <span class="badge">${escapeHtml(item.subject)}</span>
              <span class="badge">${escapeHtml(item.date)}</span>
            </div>

            <h3>${escapeHtml(item.contentQuestion)}</h3>

            <div class="detail"><strong>Class:</strong> ${escapeHtml(item.className)}</div>
            <div class="detail"><strong>Teacher:</strong> ${escapeHtml(item.teacher)}</div>
            <div class="detail"><strong>Submission Date:</strong> ${escapeHtml(item.submissionDate)}</div>
            <div class="detail"><strong>Marks:</strong> ${escapeHtml(item.assignedMarks)}</div>

            <div class="activity-box">
              <strong>Activities:</strong><br>
              ${escapeHtml(item.activities)}
            </div>

            ${fileActions}
          `;

          container.appendChild(card);
        });

      } catch (error) {
        message.textContent = error.message || error;
        message.className = 'message error';
      }
    }

    function clearSearch() {
      document.getElementById('level').value = '';
      document.getElementById('subject').innerHTML = '<option value="ALL">All subjects</option>';
      document.getElementById('searchText').value = '';
      document.getElementById('message').textContent = '';
      document.getElementById('stats').innerHTML = '';
      document.getElementById('assignmentsContent').innerHTML = '';
    }

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random() * 10000);

        window[callbackName] = data => {
          delete window[callbackName];
          script.remove();
          resolve(data);
        };

        const script = document.createElement('script');

        script.onerror = () => {
          delete window[callbackName];
          script.remove();
          reject(new Error('JSONP request failed.'));
        };

        script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callbackName;
        document.body.appendChild(script);
      });
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttribute(value) {
      return String(value || '').replaceAll('"', '&quot;');
    }
  </script>
</body>
</html>
